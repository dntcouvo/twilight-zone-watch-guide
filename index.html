<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Twilight Zone — Watch Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c;
    --bg-panel:#131316;
    --line:rgba(255,255,255,.09);
    --ink:#eae7e0;
    --ink-dim:#9a9aa0;
    --ink-faint:#5f5f66;
    --green:#54d98c;
    --amber:#e3bd66;
    --red:#d4726a;
    --blue:#8fa8d6;
    --glow: 0 0 18px rgba(143,168,214,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:50;
  }
  body::after{
    content:'';
    position:fixed; inset:0;
    background:radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
    z-index:49;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 0 90px;position:relative;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    height:250px;
    overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    background:radial-gradient(circle at 50% 40%, #16161b 0%, #0a0a0c 70%);
    border-bottom:1px solid var(--line);
  }
  .star-dot{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
  .vortex{
    position:absolute;top:50%;left:50%;
    width:340px;height:340px;
    transform:translate(-50%,-50%);
    opacity:.35;
    animation:spin 40s linear infinite;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
  .hero-content{position:relative;z-index:2;padding:0 20px;}
  .eyebrow{
    font-family:'Special Elite',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .hero h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:44px;
    letter-spacing:.06em;
    margin:0;
    line-height:.95;
    color:#f4f2ec;
    text-shadow:var(--glow);
  }
  .hero .years{
    font-family:'Special Elite',monospace;
    color:var(--ink-dim);
    font-size:13px;
    margin-top:4px;
  }
  .hero .tagline{
    margin-top:14px;
    font-style:italic;
    color:var(--blue);
    font-size:14px;
  }

  /* ---------- NAV ---------- */
  .nav{
    position:sticky;top:0;z-index:40;
    display:flex;gap:6px;
    padding:10px 14px;
    background:rgba(10,10,12,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav button{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:7px 13px;
    border-radius:20px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    white-space:nowrap;
  }
  .nav button.active{
    color:#0a0a0c;
    background:var(--blue);
    border-color:var(--blue);
  }

  .section{padding:18px 16px 4px;}
  .section h2{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:.04em;
    font-size:22px;
    margin:0 0 10px;
    color:#f4f2ec;
  }
  .muted{color:var(--ink-dim);font-size:13.5px;line-height:1.5;}

  /* ---------- PROGRESS ---------- */
  .progress-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin:10px 0;
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-num{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;color:var(--blue);}
  .progress-label{font-size:11.5px;color:var(--ink-faint);font-family:'Special Elite',monospace;letter-spacing:.05em;}
  .bar{height:6px;border-radius:4px;background:#232327;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:4px;transition:width .4s ease;}

  .quick-actions{display:flex;gap:8px;margin-top:12px;}
  .quick-actions button{
    flex:1;
    background:#1a1a1f;
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 6px;
    border-radius:10px;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
  }

  .note-box{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.55;
    margin:14px 0;
  }
  .note-box b{color:var(--ink);}

  /* ---------- FILTER CONTROLS ---------- */
  .filter-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-ms-overflow-style:none;scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:#151519;
    color:var(--ink-dim);
    padding:6px 12px;
    border-radius:16px;
    font-size:12px;
    font-weight:600;
  }
  .filter-chip.active{background:var(--ink);color:#0a0a0c;border-color:var(--ink);}
  .genre-chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:#151519;
    padding:6px 10px;
    border-radius:14px;
    font-size:14px;
  }
  .genre-chip.active{background:rgba(143,168,214,.22);border-color:var(--blue);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;font-size:13px;}
  .switch{
    width:38px;height:22px;border-radius:12px;background:#232327;position:relative;border:1px solid var(--line);flex:0 0 auto;
  }
  .switch.on{background:var(--green);border-color:var(--green);}
  .switch::after{
    content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#0a0a0c;transition:left .18s ease;
  }
  .switch.on::after{left:18px;background:#0a0a0c;}
  .search-input{
    width:100%;
    background:#151519;
    border:1px solid var(--line);
    color:var(--ink);
    padding:9px 12px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:10px;
    font-family:'Inter',sans-serif;
  }
  .search-input::placeholder{color:var(--ink-faint);}

  /* ---------- CARDS ---------- */
  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:9px;
    overflow:hidden;
  }
  .card.watched{border-color:rgba(84,217,140,.4);}
  .card-head{
    display:flex;align-items:center;gap:10px;
    padding:11px 12px;
  }
  .chk{
    width:22px;height:22px;flex:0 0 auto;
    border-radius:6px;
    border:1.5px solid var(--ink-faint);
    background:transparent;
    position:relative;
  }
  .chk.checked{background:var(--green);border-color:var(--green);}
  .chk.checked::after{
    content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#0a0a0c;font-size:13px;font-weight:700;
  }
  .card-title{flex:1;min-width:0;}
  .ep-code{font-family:'Special Elite',monospace;font-size:10.5px;color:var(--ink-faint);letter-spacing:.03em;}
  .ep-name{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3;margin-top:1px;}
  .tier-dot{font-size:15px;flex:0 0 auto;}
  .chips-row{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 10px 44px;}
  .chip{font-size:12px;background:#1c1c21;border-radius:8px;padding:2px 7px;color:var(--ink-dim);}
  .chip.rec{background:rgba(143,168,214,.2);color:var(--blue);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .cut-rank{
    font-family:'Bebas Neue',sans-serif;
    font-size:15px;color:var(--blue);
    width:22px;text-align:center;flex:0 0 auto;
  }

  .card-detail{
    display:none;
    padding:0 14px 14px 14px;
    border-top:1px solid var(--line);
  }
  .card.open .card-detail{display:block;padding-top:12px;}
  .nosearch{
    background:rgba(212,114,106,.15);
    border:1px solid rgba(212,114,106,.4);
    color:#e79b95;
    font-size:11.5px;
    font-weight:700;
    padding:6px 9px;
    border-radius:8px;
    margin-bottom:10px;
    letter-spacing:.02em;
  }
  .desc{font-size:13.5px;color:var(--ink-dim);line-height:1.55;margin:0 0 12px;}
  .rate-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stars{display:flex;gap:3px;font-size:18px;}
  .star{color:#3a3a40;cursor:pointer;}
  .star.on{color:var(--amber);}
  .fav{background:transparent;border:none;font-size:19px;padding:0;}
  .note{
    width:100%;
    background:#0f0f12;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-size:12.5px;
    padding:8px 10px;
    min-height:44px;
    resize:vertical;
    font-family:'Inter',sans-serif;
  }
  .note::placeholder{color:var(--ink-faint);}

  .empty{
    text-align:center;
    color:var(--ink-faint);
    font-size:13px;
    padding:30px 20px;
    font-style:italic;
  }

  .cut-intro{
    background:linear-gradient(135deg, rgba(143,168,214,.12), rgba(84,217,140,.06));
    border:1px solid rgba(143,168,214,.3);
    border-radius:14px;
    padding:14px 16px;
    font-size:13px;
    color:var(--ink-dim);
    line-height:1.55;
    margin-bottom:14px;
  }
  .cut-intro b{color:var(--blue);}

  .stats-block{margin-bottom:22px;}
  .stats-block h3{
    font-family:'Special Elite',monospace;
    font-size:12.5px;
    letter-spacing:.05em;
    color:var(--ink-dim);
    text-transform:uppercase;
    margin:0 0 8px;
  }

  .reset-link{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:26px;
    text-decoration:underline;
    background:none;border:none;
  }
  #loading{
    text-align:center;padding:60px 20px;color:var(--ink-faint);font-family:'Special Elite',monospace;font-size:13px;
  }
</style>
</head>

const EPISODES = RAW.map((row,i)=>({
  s:row[0], e:row[1], title:row[2], tier:row[3], genres:row[4].split(''),
  desc:row[5], rec:!!row[6], ns:!!row[7], cut:row[8],
  overall:i+1, dur: row[0]===4?51:25,
  id: row[0]+'x'+String(row[1]).padStart(2,'0')
}));
const TOTAL = EPISODES.length;
const CUT_LIST = EPISODES.filter(e=>e.cut>0).sort((a,b)=>a.cut-b.cut);

/* ============ STATE ============ */
let progress = {};
let view = 'home';
let seasonFilter = 'all';
let genreFilter = new Set();
let essentialOnly = false;
let searchTerm = '';
let saveTimer = null;

function getP(id){ return progress[id] || {w:false,r:0,f:false,note:''}; }
function setP(id, patch){ progress[id] = Object.assign(getP(id), patch); scheduleSave(); }
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set('tz-progress-v1', JSON.stringify(progress), false); }
    catch(e){ console.error('save failed', e); }
  }, 350);
}
async function loadProgress(){
  try{
    const res = await window.storage.get('tz-progress-v1');
    if(res && res.value) progress = JSON.parse(res.value);
  }catch(e){ progress = {}; }
  render();
}

/* ============ HELPERS ============ */
function overallProgress(){ return { w: EPISODES.filter(ep=>getP(ep.id).w).length, total: TOTAL }; }
function cutProgress(){ return { w: CUT_LIST.filter(ep=>getP(ep.id).w).length, total: CUT_LIST.length }; }

function filterEpisodes(list){
  return list.filter(ep=>{
    if(seasonFilter!=='all' && ep.s !== Number(seasonFilter)) return false;
    if(essentialOnly && ep.tier!=='g') return false;
    if(genreFilter.size>0 && !ep.genres.some(g=>genreFilter.has(g))) return false;
    if(searchTerm && !ep.title.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    return true;
  });
}

function starsBg(n){
  let s='';
  for(let i=0;i<n;i++){
    const top=(Math.random()*100).toFixed(1);
    const left=(Math.random()*100).toFixed(1);
    const delay=(Math.random()*4).toFixed(2);
    const size=(Math.random()*1.3+0.8).toFixed(1);
    s+=`<span class="star-dot" style="top:${top}%;left:${left}%;animation-delay:${delay}s;width:${size}px;height:${size}px;"></span>`;
  }
  return s;
}

function renderCard(ep, opts){
  opts = opts || {};
  const p = getP(ep.id);
  const tier = TIER_MAP[ep.tier];
  const genreChips = ep.genres.map(g=>`<span class="chip" title="${GENRE_MAP[g].l}">${GENRE_MAP[g].e}</span>`).join('');
  const starsHtml = [1,2,3,4,5].map(n=>`<span class="star ${p.r>=n?'on':''}" data-n="${n}">★</span>`).join('');
  const rankTag = opts.rank ? `<div class="cut-rank">${opts.rank}</div>` : '';
  return `
  <div class="card ${p.w?'watched':''}" data-id="${ep.id}">
    <div class="card-head">
      ${rankTag}
      <button class="chk ${p.w?'checked':''}" aria-label="assistido"></button>
      <div class="card-title">
        <div class="ep-code">T${ep.s}E${String(ep.e).padStart(2,'0')} · ${ep.dur} min</div>
        <div class="ep-name">${ep.title}</div>
      </div>
      <div class="tier-dot" title="${tier.l}">${tier.e}</div>
    </div>
    <div class="chips-row">${genreChips}${ep.rec?'<span class="chip rec">pra você</span>':''}</div>
    <div class="card-detail">
      ${ep.ns?'<div class="nosearch">⚠️ NÃO PESQUISE ANTES DE ASSISTIR</div>':''}
      <p class="desc">${ep.desc}</p>
      <div class="rate-row">
        <div class="stars">${starsHtml}</div>
        <button class="fav">${p.f?'❤️':'🤍'}</button>
      </div>
      <textarea class="note" placeholder="nota pessoal (opcional)">${p.note||''}</textarea>
    </div>
  </div>`;
}

function cardListHtml(list, opts){
  if(list.length===0) return '<div class="empty">nada por aqui com esses filtros.</div>';
  return list.map(ep=>renderCard(ep, opts && opts.rankMap ? {rank:opts.rankMap[ep.id]} : {})).join('');
}

/* ============ VIEWS ============ */
function navHtml(){
  const items = [
    ['home','🏠 Início'],
    ['seasons','📺 Temporadas'],
    ["cut","⭐ Dante's Cut"],
    ['stats','📊 Favoritos']
  ];
  return `<div class="nav">${items.map(([k,l])=>`<button data-view="${k}" class="${view===k?'active':''}">${l}</button>`).join('')}</div>`;
}

  const op = overallProgress();
  const cp = cutProgress();
  return `
  ${heroHtml()}
  ${navHtml()}
  <div class="section">
    <div class="progress-card">
      <div class="progress-top"><span class="progress-label">PROGRESSO GERAL</span><span class="progress-num">${op.w} / ${op.total}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${(op.w/op.total*100).toFixed(1)}%"></div></div>
    </div>
    <div class="progress-card">
      <div class="progress-top"><span class="progress-label">⭐ DANTE'S CUT</span><span class="progress-num">${cp.w} / ${cp.total}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${(cp.w/cp.total*100).toFixed(1)}%"></div></div>
      <div class="quick-actions">
        <button data-view="cut">Ver a rota rápida</button>
        <button data-view="seasons">Explorar tudo</button>
      </div>
    </div>
    <div class="note-box">
      <b>Sem spoilers, por padrão.</b> Descrições e filtros nunca revelam finais, reviravoltas ou identidades. Episódios com twists muito famosos vêm com o aviso ⚠️ NÃO PESQUISE ANTES DE ASSISTIR.<br><br>
      Quando terminar um episódio, é só me contar aqui no chat (ex: "terminei o S01E01" ou "acabei de ver o primeiro") que a gente comenta sem estragar nada do que vem depois.
    </div>
    <button class="reset-link" id="reset-btn">apagar todo o progresso</button>
  </div>`;
}

function renderSeasons(){
  const seasonChips = ['all',1,2,3,4,5].map(s=>{
    const label = s==='all' ? 'Todas' : `T${s}`;
    return `<button class="filter-chip ${seasonFilter===String(s)||(seasonFilter==='all'&&s==='all')?'active':''}" data-season="${s}">${label}</button>`;
  }).join('');
  const genreChips = Object.keys(GENRE_MAP).map(g=>{
    return `<button class="genre-chip ${genreFilter.has(g)?'active':''}" data-genre="${g}" title="${GENRE_MAP[g].l}">${GENRE_MAP[g].e}</button>`;
  }).join('');
  const filtered = filterEpisodes(EPISODES);
  const w = filtered.filter(ep=>getP(ep.id).w).length;
  return `
  ${navHtml()}
  <div class="section">
    <h2>📺 Todas as temporadas</h2>
    <input class="search-input" id="search-input" placeholder="buscar por título..." value="${searchTerm}">
    <div class="filter-row">${seasonChips}</div>
    <div class="filter-row">${genreChips}</div>
    <div class="toggle-row">
      <span>Mostrar só essenciais 🟢</span>
      <div class="switch ${essentialOnly?'on':''}" id="essential-toggle"></div>
    </div>
    <div class="progress-card" style="margin-top:6px;">
      <div class="progress-top"><span class="progress-label">NESTE FILTRO</span><span class="progress-num">${w} / ${filtered.length}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${filtered.length? (w/filtered.length*100).toFixed(1):0}%"></div></div>
    </div>
    <div id="ep-list">${cardListHtml(filtered)}</div>
  </div>`;
}

function renderCut(){
  const cp = cutProgress();
  const rankMap = {};
  CUT_LIST.forEach(ep=>rankMap[ep.id]=ep.cut);
  return `
  ${navHtml()}
  <div class="section">
    <h2>⭐ Dante's Cut</h2>
    <div class="cut-intro">
      Os <b>20 episódios essenciais</b> pra sentir o melhor da série sem precisar ver os 156. Terror, paranoia, ficção científica e aquele clima de "tem alguma coisa muito errada aqui" — na ordem recomendada.
    </div>
    <div class="progress-card">
      <div class="progress-top"><span class="progress-label">ROTA RÁPIDA</span><span class="progress-num">${cp.w} / ${cp.total}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${(cp.w/cp.total*100).toFixed(1)}%"></div></div>
    </div>
    <div id="ep-list">${cardListHtml(CUT_LIST, {rankMap})}</div>
  </div>`;
}

function renderStats(){
  const favs = EPISODES.filter(ep=>getP(ep.id).f);
  const scary = EPISODES.filter(ep=>{const p=getP(ep.id); return p.w && p.r>0 && (ep.genres.includes('H')||ep.genres.includes('D'));}).sort((a,b)=>getP(b.id).r-getP(a.id).r).slice(0,5);
  const weird = EPISODES.filter(ep=>{const p=getP(ep.id); return p.w && p.r>0 && (ep.genres.includes('P')||ep.genres.includes('M'));}).sort((a,b)=>getP(b.id).r-getP(a.id).r).slice(0,5);
  const disappointing = EPISODES.filter(ep=>{const p=getP(ep.id); return p.w && p.r>0 && p.r<=2;}).sort((a,b)=>getP(a.id).r-getP(b.id).r).slice(0,5);

  function block(title, list, emptyMsg){
    return `<div class="stats-block"><h3>${title}</h3>${list.length? cardListHtml(list) : `<div class="empty">${emptyMsg}</div>`}</div>`;
  }
  return `
  ${navHtml()}
  <div class="section">
    <h2>📊 Seu acompanhamento</h2>
    ${block('❤️ Seus favoritos', favs, 'marque um ❤️ depois de assistir pra ele aparecer aqui.')}
    ${block('👻 Seus mais assustadores', scary, 'avalie episódios de terror/perturbadores pra ver o ranking aqui.')}
    ${block('🧠 Seus mais estranhos', weird, 'avalie episódios psicológicos/de mistério pra ver o ranking aqui.')}
    ${block('😑 Seus mais decepcionantes', disappointing, 'nenhum episódio com nota baixa ainda — ótimo sinal.')}
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(view==='home') app.innerHTML = renderHome();
  else if(view==='seasons') app.innerHTML = renderSeasons();
  else if(view==='cut') app.innerHTML = renderCut();
  else if(view==='stats') app.innerHTML = renderStats();
  attachEvents();
}

/* ============ EVENTS ============ */
function attachEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ view = btn.dataset.view; render(); });
  });

  const resetBtn = document.getElementById('reset-btn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(confirm('Isso vai apagar todo o seu progresso, notas e avaliações. Tem certeza?')){
        progress = {};
        try{ await window.storage.set('tz-progress-v1', JSON.stringify(progress), false); }catch(e){}
        render();
      }
    });
  }

  const seasonBtns = app.querySelectorAll('[data-season]');
  seasonBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{ seasonFilter = btn.dataset.season; render(); });
  });

  const genreBtns = app.querySelectorAll('[data-genre]');
  genreBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const g = btn.dataset.genre;
      if(genreFilter.has(g)) genreFilter.delete(g); else genreFilter.add(g);
      render();
    });
  });

  const essentialToggle = document.getElementById('essential-toggle');
  if(essentialToggle){
    essentialToggle.addEventListener('click', ()=>{ essentialOnly = !essentialOnly; render(); });
  }

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{
      searchTerm = e.target.value;
      const filtered = filterEpisodes(EPISODES);
      document.getElementById('ep-list').innerHTML = cardListHtml(filtered);
      attachCardEvents();
    });
  }

  attachCardEvents();
}

function attachCardEvents(){
  document.querySelectorAll('.card').forEach(card=>{
    const id = card.dataset.id;

    card.querySelector('.card-head').addEventListener('click', (e)=>{
      if(e.target.closest('.chk')) return;
      card.classList.toggle('open');
    });

    card.querySelector('.chk').addEventListener('click', (e)=>{
      e.stopPropagation();
      const p = getP(id);
      setP(id, {w:!p.w});
      updateProgressBars();
      card.classList.toggle('watched');
      e.target.classList.toggle('checked');
    });

    const favBtn = card.querySelector('.fav');
    if(favBtn){
      favBtn.addEventListener('click', ()=>{
        const p = getP(id);
        setP(id, {f:!p.f});
        favBtn.textContent = !p.f ? '❤️' : '🤍';
      });
    }

    const stars = card.querySelectorAll('.star');
    stars.forEach(star=>{
      star.addEventListener('click', ()=>{
        const n = Number(star.dataset.n);
        const p = getP(id);
        const newVal = p.r===n ? 0 : n;
        setP(id, {r:newVal});
        stars.forEach(s=>s.classList.toggle('on', Number(s.dataset.n)<=newVal));
      });
    });

    const note = card.querySelector('.note');
    if(note){
      note.addEventListener('change', ()=>{ setP(id, {note:note.value}); });
    }
  });
}

function updateProgressBars(){
  document.querySelectorAll('.progress-card').forEach(pc=>{
    // recompute by re-rendering current view's progress numbers only for simplicity
  });
  // simplest reliable approach: soft re-render header progress cards without losing open cards
  const op = overallProgress();
  const cp = cutProgress();
  const nums = document.querySelectorAll('.progress-num');
  if(view==='home' && nums.length>=2){
    nums[0].textContent = `${op.w} / ${op.total}`;
    nums[1].textContent = `${cp.w} / ${cp.total}`;
    document.querySelectorAll('.bar-fill')[0].style.width = (op.w/op.total*100).toFixed(1)+'%';
    document.querySelectorAll('.bar-fill')[1].style.width = (cp.w/cp.total*100).toFixed(1)+'%';
  } else if(view==='seasons' && nums.length>=1){
    const filtered = filterEpisodes(EPISODES);
    const w = filtered.filter(ep=>getP(ep.id).w).length;
    nums[0].textContent = `${w} / ${filtered.length}`;
    document.querySelectorAll('.bar-fill')[0].style.width = (filtered.length? (w/filtered.length*100):0).toFixed(1)+'%';
  } else if(view==='cut' && nums.length>=1){
    nums[0].textContent = `${cp.w} / ${cp.total}`;
    document.querySelectorAll('.bar-fill')[0].style.width = (cp.w/cp.total*100).toFixed(1)+'%';
  }
}

/* ============ INIT ============ */
loadProgress();
</script>
